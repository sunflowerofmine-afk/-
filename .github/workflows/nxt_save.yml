name: NXT 거래대금 저장

# NXT 종료(20:00 KST) 이후 실행.
# ★ 주 경로(2026-11-24부터): nxt_evening.yml(cron-job.org 19:30 트리거)이 20:03까지 기다렸다가
#   이 워크플로를 workflow_call로 부른다. GitHub schedule은 20:10 예약이 8~11시간씩 밀려
#   11-23분이 11-24 07:34에 돌았고, 그때는 NXT 전날 자료가 이미 사라져 파일이 비었다(복구 불가).
# 아래 schedule은 예비로만 남긴다 — 자료가 없으면 저장하지 않으므로 주 경로 파일을 덮어쓰지 않는다.
on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "10 11 * * 1-5"   # 20:10 KST (= 11:10 UTC), 월-금

jobs:
  save-nxt:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Save NXT trading value
        env:
          TZ: Asia/Seoul
        run: python -m scripts.save_nxt

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nxt-${{ github.run_id }}
          path: data/nxt/
          retention-days: 90

      # 영구 백업 (비공개 레포 jongbe-data-backup). DATA_BACKUP_SSH_KEY 미설정 시 skip
      - name: Backup NXT data to private repo
        if: always()
        env:
          BACKUP_KEY: ${{ secrets.DATA_BACKUP_SSH_KEY }}
        run: |
          if [ -z "$BACKUP_KEY" ]; then
            echo "DATA_BACKUP_SSH_KEY 미설정 — 백업 skip"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$BACKUP_KEY" > ~/.ssh/backup_key
          chmod 600 ~/.ssh/backup_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/backup_key -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:sunflowerofmine-afk/jongbe-data-backup.git /tmp/backup
          mkdir -p /tmp/backup/data/nxt
          cp -r data/nxt/* /tmp/backup/data/nxt/ 2>/dev/null || true
          # 종베 시뮬레이터 재료(분봉·뉴스·15:35 스냅샷 사본) — 분봉은 6거래일 뒤 사라진다 (2026-09-27)
          TZ=Asia/Seoul SIM_DIR=/tmp/backup/data/sim SIGNALS_DIR=/tmp/backup/data/signals \
            python -m scripts.save_sim_daily || echo "시뮬레이터 재료 저장 실패"
          cd /tmp/backup
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "변경 없음" || \
            git commit -m "nxt·sim: $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push || echo "백업 push 실패"
