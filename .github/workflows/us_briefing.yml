name: US Market Briefing

on:
  workflow_dispatch:           # cron-job.org 07:40 KST 트리거 (schedule 제거 — 중복 발송 방지)

# 2026-09-08 발송 중단 — morning_briefing에 흡수했다(그 알림이 07:40으로 이동).
# 07:40과 08:50이 한 시간 간격으로 연달아 와 알림 피로가 컸다.
# cron-job.org의 07:40 트리거를 지우면 이 파일도 제거 가능하다.
jobs:
  briefing:
    if: false          # morning_briefing에 통합 (2026-09-08)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run US briefing
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          TZ: Asia/Seoul
        run: python -m scripts.us_briefing
