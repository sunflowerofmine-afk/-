name: Checks

# 알림이 실제로 도는 건 하루 4번뿐이고, 분기마다 다른 데이터가 흐른다.
# 그래서 잘못 들어간 코드가 몇 시간에서 며칠 뒤에야 드러났다.
# 여기서 푸시 즉시 잡는다.
on:
  push:
    paths:
      - "scripts/**.py"
      - "config/**.py"
      - ".github/workflows/checks.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pyflakes

      # ① 미정의 이름 — import는 통과하고 실행할 때 죽는 유형.
      #    2026-09-08 대시보드가 이렇게 죽었다(_OBS_TAG_COLOR). 죽은 코드를
      #    정리하면서 정의만 지우고 사용처를 남긴 것이 원인이었다.
      - name: 미정의 이름 검사
        run: |
          out=$(python -m pyflakes scripts/*.py config/*.py 2>&1 | grep "undefined name" || true)
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::정의 없이 쓰이는 이름이 있습니다. 실행 시 NameError로 죽습니다."
            exit 1
          fi
          echo "미정의 이름 없음"

      # ② 분기별 렌더 — 데이터가 있어야만 타는 경로를 강제로 태운다.
      - name: 알림·대시보드 출력 스모크
        run: python -m scripts.smoke_render

      # ③ 운반 딕셔너리에 없는 키를 읽는 곳.
      #    2026-09-09: _daily_gate가 run_type을 market_summary에서 읽었는데 그 키는
      #    metadata에만 있었다. 늘 None이라 엿새간 대시보드가 조용히 틀린 값을 냈다.
      #    .get()은 에러를 안 내므로 pyflakes도 스모크도 못 잡는 유형이다.
      - name: 운반 딕셔너리 키 대조
        run: python -m scripts.audit_carriers -v

      # ④ 선별력·손절·게이트 집계가 깨지지 않는지. 데이터는 Actions에 없으므로
      #    임포트와 인자 파싱만 확인한다(실집계는 로컬에서 백업 레포를 보고 돈다).
      - name: 감사 스크립트 임포트 확인
        run: |
          python -c "import scripts.audit_selection, scripts.audit_memory; print('감사 스크립트 로드 OK')"

      # 참고용. 실패시키지 않는다 — 미사용 import 같은 건 급하지 않다.
      - name: 그 밖의 린트 (참고)
        continue-on-error: true
        run: python -m pyflakes scripts/*.py config/*.py
