name: Korea Close Betting Bot

on:
  workflow_dispatch:           # cron-job.org → POST /dispatches 로 트리거
    inputs:
      force_run:
        description: '비거래일에도 강제 실행 (true/false)'
        required: false
        default: 'false'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    # reports/ 자동 커밋에 쓰기 권한 필요
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 자동 커밋을 위해 fetch-depth 0 필요
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Korean font (테마 맵)
        run: sudo apt-get install -y -qq fonts-nanum > /dev/null

      - name: Harvest trade inputs (텔레그램 답장 → 비공개 백업 레포)
        # 사용자가 봇 채팅에 남긴 매매 근거를 수거한다. 공개 레포엔 남기지 않는다.
        # 텔레그램은 미수거 메시지를 24시간만 보관하므로 매 실행마다 먼저 돈다.
        # 수거가 실패해도 알림은 나가야 한다 — 2026-09-11 19:30 실행이 여기서 죽어 시황이 안 갔다.
        continue-on-error: true
        if: always()
        env:
          BACKUP_KEY:         ${{ secrets.DATA_BACKUP_SSH_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Asia/Seoul
        run: |
          if [ -z "$BACKUP_KEY" ]; then
            echo "DATA_BACKUP_SSH_KEY 미설정 — 수거 skip"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$BACKUP_KEY" > ~/.ssh/backup_key
          chmod 600 ~/.ssh/backup_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/backup_key -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:sunflowerofmine-afk/jongbe-data-backup.git /tmp/trades_repo
          python -m scripts.harvest_trades --store /tmp/trades_repo/data/trades
          cd /tmp/trades_repo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data/trades
          git add data/trades
          git diff --cached --quiet && echo "새 입력 없음" ||             (git commit -m "trades: $(date +%Y-%m-%d_%H%M) 텔레그램 입력 수거" && git push)

      - name: Run pipeline
        env:
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGES_BASE_URL:        ${{ secrets.PAGES_BASE_URL }}
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          DART_API_KEY:          ${{ secrets.DART_API_KEY }}
          FORCE_RUN:             ${{ github.event.inputs.force_run }}
          TZ: Asia/Seoul
        run: python -m scripts.pipeline

      - name: Commit market data
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market_history.csv 2>/dev/null || true
          git add data/krx_close/ 2>/dev/null || true
          git add data/evening_snapshot/ 2>/dev/null || true
          git add data/sim_snapshot/ 2>/dev/null || true
          git add data/app/ 2>/dev/null || true
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "chore: market data [skip ci]"
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push && exit 0; sleep 10; done
          exit 1

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-output-${{ github.run_id }}
          path: |
            data/
            logs/
          retention-days: 30
