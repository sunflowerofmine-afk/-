name: Harvest Trade Inputs

# 텔레그램 답장(매매 근거) 수거 전용. 텔레그램은 미수거 메시지를 24시간만 보관하는데
# cron-job.org는 주말·휴일에 봇을 깨우지 않는다 — 금요일 저녁 입력이 월요일 아침이면 사라진다.
# 그래서 GitHub schedule로 하루 두 번 따로 돈다(GitHub cron은 몇 시간 늦을 수 있어 두 번).
on:
  schedule:
    - cron: "0 3 * * *"    # 12:00 KST
    - cron: "0 14 * * *"   # 23:00 KST
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Harvest trade inputs (텔레그램 답장 → 비공개 백업 레포)
        # 수거가 실패해도 알림은 나가야 한다 — 2026-09-11 19:30 실행이 여기서 죽어 시황이 안 갔다.
        continue-on-error: true
        env:
          BACKUP_KEY:         ${{ secrets.DATA_BACKUP_SSH_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Asia/Seoul
        run: |
          if [ -z "$BACKUP_KEY" ]; then
            echo "DATA_BACKUP_SSH_KEY 미설정 — 수거 skip"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$BACKUP_KEY" > ~/.ssh/backup_key
          chmod 600 ~/.ssh/backup_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/backup_key -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:sunflowerofmine-afk/jongbe-data-backup.git /tmp/trades_repo
          python -m scripts.harvest_trades --store /tmp/trades_repo/data/trades
          cd /tmp/trades_repo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data/trades
          git add data/trades
          git diff --cached --quiet && echo "새 입력 없음" || \
            (git commit -m "trades: $(date +%Y-%m-%d_%H%M) 텔레그램 입력 수거" && git push)
