name: NXT Evening (19:30 시황)

# 3차 알림 — NXT 저녁 흐름 (19:30 KST).
# 돌팬티 실제 진입(NXT 막판 19:50~20:00) 직전에 KRX 종가 대비 NXT 현재가를 확인시킨다.
#
# 트리거: cron-job.org → POST /dispatches (평일 19:30 KST, Asia/Seoul)
#   GitHub 네이티브 cron은 지연이 커서(weekly_research 실측 2시간) 쓰지 않는다.
#   19:50 NXT 진입 전에 도착해야 하므로 run_bot.yml과 동일한 외부 트리거 방식.
#   schedule을 함께 두면 네이티브 cron이 늦게 또 실행돼 알림이 중복되므로 제외.
on:
  workflow_dispatch:

jobs:
  nxt-evening:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Korean font (테마 맵)
        run: sudo apt-get install -y -qq fonts-nanum > /dev/null

      - name: Harvest trade inputs (텔레그램 답장 → 비공개 백업 레포)
        # 사용자가 봇 채팅에 남긴 매매 근거를 수거한다. 공개 레포엔 남기지 않는다.
        # 텔레그램은 미수거 메시지를 24시간만 보관하므로 매 실행마다 먼저 돈다.
        if: always()
        env:
          BACKUP_KEY:         ${{ secrets.DATA_BACKUP_SSH_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Asia/Seoul
        run: |
          if [ -z "$BACKUP_KEY" ]; then
            echo "DATA_BACKUP_SSH_KEY 미설정 — 수거 skip"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$BACKUP_KEY" > ~/.ssh/backup_key
          chmod 600 ~/.ssh/backup_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/backup_key -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:sunflowerofmine-afk/jongbe-data-backup.git /tmp/trades_repo
          python -m scripts.harvest_trades --store /tmp/trades_repo/data/trades
          cd /tmp/trades_repo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/trades
          git diff --cached --quiet && echo "새 입력 없음" ||             (git commit -m "trades: $(date +%Y-%m-%d_%H%M) 텔레그램 입력 수거" && git push)

      - name: 비거래일 체크
        id: tradingday
        env:
          TZ: Asia/Seoul
        run: |
          python -c "
          from datetime import date
          from scripts.market_calendar import is_trading_day
          print('yes' if is_trading_day(date.today()) else 'no')
          " > /tmp/td.txt
          echo "result=$(cat /tmp/td.txt)" >> $GITHUB_OUTPUT

      - name: Send 19:30 market brief
        if: steps.tradingday.outputs.result == 'yes'
        env:
          TZ: Asia/Seoul
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scripts.nxt_evening

      - name: Commit market history
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market_history.csv 2>/dev/null || true
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: market history 19:30 [skip ci]"
          git pull --rebase --autostash origin main
          git push
