name: Morning Briefing

on:
  workflow_dispatch:           # cron-job.org 07:40 KST 트리거 (schedule 제거 — 중복 발송 방지)
  # 2026-09-08: 08:50 → 07:40으로 앞당겼다. 돌팬티 3강 00:09:28 "프리장에서
  # 8시에서 8시 50분까지 종가베팅 대응 필수" — 08:50은 대응 창이 닫힐 때 도착했다.
  # 개장(08:00) 전이므로 시가가 없다. morning_briefing이 _is_pre_open()으로
  # 갭 대신 청산 계획 문구를 낸다.

jobs:
  briefing:
    runs-on: ubuntu-latest
    # 테마 구성 종목 파일(data/theme_members.json) 자동 커밋에 쓰기 권한 필요
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Korean font (복기 카드)
        run: sudo apt-get install -y -qq fonts-nanum > /dev/null

      - name: Harvest trade inputs (텔레그램 답장 → 비공개 백업 레포)
        # 사용자가 봇 채팅에 남긴 매매 근거를 수거한다. 공개 레포엔 남기지 않는다.
        # 텔레그램은 미수거 메시지를 24시간만 보관하므로 매 실행마다 먼저 돈다.
        # 수거가 실패해도 알림은 나가야 한다 — 2026-09-11 19:30 실행이 여기서 죽어 시황이 안 갔다.
        continue-on-error: true
        if: always()
        env:
          BACKUP_KEY:         ${{ secrets.DATA_BACKUP_SSH_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Asia/Seoul
        run: |
          if [ -z "$BACKUP_KEY" ]; then
            echo "DATA_BACKUP_SSH_KEY 미설정 — 수거 skip"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$BACKUP_KEY" > ~/.ssh/backup_key
          chmod 600 ~/.ssh/backup_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/backup_key -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:sunflowerofmine-afk/jongbe-data-backup.git /tmp/trades_repo
          python -m scripts.harvest_trades --store /tmp/trades_repo/data/trades
          cd /tmp/trades_repo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data/trades
          git add data/trades
          git diff --cached --quiet && echo "새 입력 없음" ||             (git commit -m "trades: $(date +%Y-%m-%d_%H%M) 텔레그램 입력 수거" && git push)

      - name: Run morning briefing
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TRADES_DIR: /tmp/trades_repo/data/trades
          TZ: Asia/Seoul
        run: python -m scripts.morning_briefing

      - name: Save theme members (14:20 테마 히트맵용)
        # 구성 종목은 그 자리에서 받으면 1분 넘게 걸려 14:20 알림이 늦는다(2026-10-25) — 아침에 하루 한 번 저장.
        # 브리핑 발송 뒤에 돈다(브리핑을 늦추지 않게). 실패하면 14:20은 전날 파일을, 파일이 없으면 예전 테마 맵을 쓴다.
        continue-on-error: true
        if: always()
        env:
          TZ: Asia/Seoul
        run: |
          python -m scripts.theme_members
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/theme_members.json
          git diff --cached --quiet && echo "테마 구성 변화 없음" ||             (git commit -m "chore: 테마 구성 종목 저장 [skip ci]" && for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done)
